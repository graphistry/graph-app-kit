name: Publish

# Uploads the CloudFormation templates that customers deploy (README "Launch Stack")
# to the public bucket under templates/latest/.
#
# Only master may publish, and only through the protected `publish-templates`
# environment (required reviewers + deployment branch policy: master). AWS access
# is a short-lived GitHub OIDC session whose IAM role trusts only that environment
# and may only write templates/latest/*. Setup: DEVELOP.md "AWS Publish action".

on:

  #Merge
  push:
    branches:
      - master
    paths:
      - 'src/bootstraps/core/*.yml'
      - 'src/bootstraps/neptune/*.yml'
      - '.github/workflows/publish.yml'

  #Manual republish (master only; other refs are skipped)
  workflow_dispatch:

permissions: {}

jobs:

  publish:
    name: Upload CloudFormation templates to S3
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level and keyed by ref so a skipped non-master dispatch never joins
    # (and cancels a pending run in) the master publish queue.
    concurrency:
      group: publish-templates-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: publish-templates
      url: https://graph-app-kit-repo-public.s3.us-east-2.amazonaws.com/templates/latest/core/graphistry.yml
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      S3_BUCKET: graph-app-kit-repo-public
      AWS_ROLE_ARN: ${{ vars.AWS_S3_PUBLISH_ROLE_ARN }}

    steps:
    - name: Require OIDC role configuration
      run: |
        if [ -z "$AWS_ROLE_ARN" ]; then
          echo "::error::Environment variable AWS_S3_PUBLISH_ROLE_ARN is not set on the publish-templates environment"
          exit 1
        fi

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        role-session-name: graph-app-kit-publish-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Copy CloudFormation templates
      run: |
        set -euo pipefail
        for template in core/graphistry.yml core/minimal.yml neptune/graphistry.yml neptune/minimal.yml; do
          aws s3 cp "src/bootstraps/${template}" "s3://${S3_BUCKET}/templates/latest/${template}"
        done
