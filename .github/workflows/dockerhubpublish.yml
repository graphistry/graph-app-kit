name: build&publishtoDockerHub

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+(.*)'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to bump to'
        required: false
      cuda_versions:
        description: 'JSON array of CUDA versions'
        required: false
        default: '["12.8", "11.8"]'

  workflow_call:

permissions: {}

jobs:
  docker-build-publish:
    # Pushes public images (including :latest-<cuda>), so only master or release tags may
    # publish; manual dispatch from any other branch is skipped. The DockerHub token lives
    # on the protected `dockerhub-publish` environment (see DEVELOP.md).
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest-4-cores
    environment: dockerhub-publish
    permissions:
      contents: read
    strategy:
      matrix:
        CUDA_SHORT_VERSION: ${{ fromJSON(inputs.cuda_versions || '["12.8", "11.8"]') }}
      fail-fast: true


    steps:

      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: get most recent tag
        run: |
          echo "RELEASE_VERSION=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"
          echo "CUDA_SHORT_VERSION=${MATRIX_CUDA_SHORT_VERSION}" >> "$GITHUB_ENV"
        env:
          MATRIX_CUDA_SHORT_VERSION: ${{ matrix.CUDA_SHORT_VERSION }}

      - name: check env
        run: |
          echo "$RELEASE_VERSION"
          echo "$CUDA_SHORT_VERSION"

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Graph-App-Kit
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

        run: |
          cd src/docker \
          && GRAPHISTRY_FORGE_BASE_VERSION="v${RELEASE_VERSION}-${CUDA_SHORT_VERSION}" docker compose -f docker-compose.yml build

      - name: tag the image
        run: |
          docker tag "graphistry/graph-app-kit-st:latest-${CUDA_SHORT_VERSION}" "graphistry/graph-app-kit-st:v${RELEASE_VERSION}-${CUDA_SHORT_VERSION}"

      - name: Publish Graph-App-Kit to DockerHub
        run: |
          docker push "graphistry/graph-app-kit-st:v${RELEASE_VERSION}-${CUDA_SHORT_VERSION}" && docker push "graphistry/graph-app-kit-st:latest-${CUDA_SHORT_VERSION}"
